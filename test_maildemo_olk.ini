[CONFIG]
; Configurazione generale ntJobsApp
TYPE=NTJOBS.APP.1
NAME=OLK_DEMO
LOG=olk_process.log
EXIT=TRUE

; --- Configurazione Specifica Applicazione ---
; Definisce l'engine Outlook
MAIL.ENGINE=OLK

; Nome del file JSON contenente le mail (compatibile con maildemo.json)
FILE.IN.JSON=json\maildemo.json

; Delimitatore per liste di email nel JSON
DELIMITER=,

; --- Parametri di Attesa ---
; Attesa dopo l'avvio di Outlook (secondi)
WAIT.START=3
; Attesa tra una mail e l'altra per non intasare il client (secondi)
WAIT.MAIL=5

; --- Definizione dei Job (Sequenza di comandi) ---

[JOB_01_AVVIO]
; Avvia esplicitamente Outlook (o si aggancia se già aperto)
COMMAND=OLK.START

[JOB_02_INVIO]
; Esegue il ciclo di lettura JSON e invio mail
COMMAND=SEND

; [JOB_03_CHIUSURA]
; Opzionale: Decommentare le righe sotto se si vuole chiudere Outlook alla fine
; COMMAND=OLK.KILL